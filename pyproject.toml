[project]
name = "nyayalens"
version = "0.1.0"
description = "Understand what you sign, with proof. Grounded explanations of Indian legal documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle + pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # flake8-bugbear
  "SIM",              # flake8-simplify
  "C4",               # flake8-comprehensions
  "RET",              # flake8-return
  "PTH",              # flake8-use-pathlib
  "PL",               # pylint
  "RUF",              # ruff-specific
  "S",                # flake8-bandit
  "C90",              # mccabe complexity
  "D",                # pydocstyle
  "ANN",              # flake8-annotations
  "ARG",              # unused arguments
  "TID",              # tidy imports
  "ERA",              # commented-out code
  "T20",              # print / pprint
]
ignore = [
  "D203",   # conflicts with D211 (blank line before class)
  "D213",   # conflicts with D212 (multi-line summary position)
  "ANN401", # typing.Any is allowed at SDK boundaries only; enforced by mypy strict
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Rules that are idiomatic inside a test suite: asserts (S101), literal
# expectations (PLR2004), the ambiguous characters the normaliser exists to
# handle (RUF001), imports placed beside the behaviour under test (PLC0415),
# fixtures requested for their side effect (ARG001), and test data that reads
# better as one string than wrapped (E501, S105).
"tests/**" = [
  "S101", "S105", "D100", "D101", "D102", "D103", "D104", "D205",
  "PLR2004", "ANN", "RUF001", "PLC0415", "ARG001", "E501",
]
# RUF001 flags characters that look like ASCII but are not. Recognising exactly
# those characters is what these modules are for, so the literals are deliberate.
"app/domain/normalize.py" = ["RUF001"]
"app/domain/segmentation.py" = ["RUF001"]
"app/domain/definitions.py" = ["RUF001"]
"app/domain/laws/references.py" = ["RUF001"]
"evals/**" = ["T20", "D100", "D103"]
"scripts/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "weasyprint.*", "docx.*", "slowapi.*", "markdown_it.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: browser tests, need a running app and Chromium"]
filterwarnings = ["error", "ignore::DeprecationWarning:weasyprint.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/adapters/llm/gemini.py", "app/adapters/*/google_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]

# ---------------------------------------------------------------- bandit

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]

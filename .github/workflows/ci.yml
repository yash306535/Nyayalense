name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Every job runs against the deterministic fake provider: no keys, no network.
  LLM_PROVIDER: fake

jobs:
  quality:
    name: Lint, types and security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests scripts evals

      - name: Ruff format
        run: ruff format --check app tests scripts evals

      - name: mypy (strict)
        run: mypy app scripts

      - name: bandit
        run: bandit -q -c pyproject.toml -r app scripts

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: ESLint
        run: npx --yes eslint frontend

      - name: Unit tests
        run: node --test "frontend/tests/*.test.js"

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install WeasyPrint system libraries and Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            fonts-noto-core fonts-noto-ui-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90 --ignore=tests/e2e

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install WeasyPrint system libraries and Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            fonts-noto-core fonts-noto-ui-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run Playwright and axe
        run: pytest tests/e2e -q

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
          retention-days: 7

  docker:
    name: Container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t nyayalens:ci .

      - name: Start it and check the health endpoint
        run: |
          docker run -d --name nyayalens -p 8080:8080 -e LLM_PROVIDER=fake nyayalens:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs nyayalens
          exit 1
